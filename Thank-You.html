
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | BrightPath Academy</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #f7f5ff, #e9e3ff);
            color: #29204f;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            padding: 45px 30px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 45px rgba(73,59,148,0.15);
        }

        .check {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            background: #e3f9ec;
            color: #20a45a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #6655c9;
        }

        p {
            color: #706b87;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .brand {
            font-weight: 800;
            font-size: 19px;
            color: #493b94;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background: #493b94;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            transition: 0.3s;
        }

        a:hover {
            background: #6655c9;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #9991b5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="brand">✦ BrightPath Academy</div>

        <div class="check">✓</div>

        <h1>Thank <span>You!</span></h1>

        <p>
            Your inquiry has been submitted successfully!
            Thank you for choosing BrightPath Academy.
            Our team will contact you soon.
        </p>

        <a href="index.html">← Back to Homepage</a>

        <div class="footer">
            Learn. Grow. Shine. ✨
        </div>

    </div>

</body>
</html>
